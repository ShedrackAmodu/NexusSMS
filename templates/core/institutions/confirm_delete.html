{% extends "base.html" %}

{% block title %}Confirm delete - {{ object }}{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1>Confirm delete</h1>
  <p>Are you sure you want to delete "{{ object }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'core:institution_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
