<style id="ui-config-styles">
  :root {
      /* Primary Colors */
      --ui-primary-color: {{ ui_config.ui_primary_color|default:'#0d6efd' }};
      --ui-secondary-color: {{ ui_config.ui_secondary_color|default:'#6c757d' }};
      --ui-success-color: {{ ui_config.ui_success_color|default:'#198754' }};
      --ui-danger-color: {{ ui_config.ui_danger_color|default:'#dc3545' }};
      --ui-warning-color: {{ ui_config.ui_warning_color|default:'#ffc107' }};
      --ui-info-color: {{ ui_config.ui_info_color|default:'#0dcaf0' }};
      --ui-accent-color: {{ ui_config.ui_accent_color|default:'#6610f2' }};

      /* Typography */
      --ui-font-family-primary: {{ ui_config.ui_font_family_primary|default:'"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'|safe }};
      --ui-font-family-secondary: {{ ui_config.ui_font_family_secondary|default:'"Poppins", sans-serif'|safe }};
      --ui-font-size-base: {{ ui_config.ui_font_size_base|default:'1rem' }};
      --ui-font-weight-normal: {{ ui_config.ui_font_weight_normal|default:'400' }};
      --ui-font-weight-bold: {{ ui_config.ui_font_weight_bold|default:'600' }};
      --ui-line-height-base: {{ ui_config.ui_line_height_base|default:'1.5' }};

      /* Spacing */
      --ui-border-radius: {{ ui_config.ui_border_radius|default:'0.375rem' }};
      --ui-border-radius-sm: {{ ui_config.ui_border_radius_sm|default:'0.25rem' }};
      --ui-border-radius-lg: {{ ui_config.ui_border_radius_lg|default:'0.5rem' }};
      --ui-spacing-unit: {{ ui_config.ui_spacing_unit|default:'1rem' }};

      /* Shadows */
      --ui-shadow-sm: {{ ui_config.ui_shadow_sm|default:'0 1px 2px 0 rgba(0, 0, 0, 0.05)'|safe }};
      --ui-shadow: {{ ui_config.ui_shadow|default:'0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)'|safe }};
      --ui-shadow-lg: {{ ui_config.ui_shadow_lg|default:'0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)'|safe }};
      --ui-shadow-xl: {{ ui_config.ui_shadow_xl|default:'0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)'|safe }};

      /* Component Dimensions */
      --ui-header-height: {{ ui_config.ui_header_height|default:'80px' }};
      --ui-sidebar-width: {{ ui_config.ui_sidebar_width|default:'280px' }};
      --ui-container-max-width: {{ ui_config.ui_container_max_width|default:'1200px' }};

      /* Animations */
      --ui-transition-duration: {{ ui_config.ui_transition_duration|default:'0.3s' }};
      --ui-transition-easing: {{ ui_config.ui_transition_easing|default:'ease-in-out' }};
  }

  /* Dark Theme Overrides */
  [data-bs-theme="dark"] {
      --ui-primary-color: {{ ui_config.ui_dark_primary_color|default:'#6ea8fe' }};
      --ui-secondary-color: {{ ui_config.ui_dark_secondary_color|default:'#a7acb1' }};
      --ui-bg-color: {{ ui_config.ui_dark_bg_color|default:'#212529' }};
      --ui-surface-color: {{ ui_config.ui_dark_surface_color|default:'#343a40' }};
      --ui-text-color: {{ ui_config.ui_dark_text_color|default:'#dee2e6' }};
      --ui-text-muted: {{ ui_config.ui_dark_text_muted|default:'#adb5bd' }};
  }

  /* Apply UI Configuration to Components */

  /* Typography */
  body {
      font-family: var(--ui-font-family-primary);
      font-size: var(--ui-font-size-base);
      line-height: var(--ui-line-height-base);
      font-weight: var(--ui-font-weight-normal);
  }

  h1, h2, h3, h4, h5, h6 {
      font-family: var(--ui-font-family-secondary);
      font-weight: var(--ui-font-weight-bold);
  }

  /* Border Radius */
  {% if ui_config.ui_enable_rounded_corners %}
  .card, .btn, .form-control, .modal-content, .dropdown-menu {
      border-radius: var(--ui-border-radius) !important;
  }

  .btn-sm {
      border-radius: var(--ui-border-radius-sm) !important;
  }

  .btn-lg {
      border-radius: var(--ui-border-radius-lg) !important;
  }
  {% endif %}

  /* Shadows */
  {% if ui_config.ui_enable_shadows %}
  .card {
      box-shadow: var(--ui-shadow) !important;
  }

  .modal-content {
      box-shadow: var(--ui-shadow-xl) !important;
  }

  .dropdown-menu {
      box-shadow: var(--ui-shadow-lg) !important;
  }
  {% endif %}

  /* Transitions */
  {% if ui_config.ui_enable_animations %}
  * {
      transition: all var(--ui-transition-duration) var(--ui-transition-easing);
  }
  {% endif %}

  /* Layout Dimensions */
  .layout-container .sidebar {
      width: var(--ui-sidebar-width);
  }

  .page-header {
      min-height: var(--ui-header-height);
  }

  .container-fluid {
      max-width: 100%;
  }

  /* Compact Mode */
  {% if ui_config.ui_compact_mode %}
  .card-body {
      padding: 1rem !important;
  }

  .btn {
      padding: 0.375rem 0.75rem !important;
      font-size: 0.875rem !important;
  }

  .form-control {
      padding: 0.375rem 0.75rem !important;
  }
  {% endif %}
</style>
